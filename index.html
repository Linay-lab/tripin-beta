(function(){
  // Each in-app page transition becomes a real browser history entry.

  history.replaceState(snapshot(),'');
  go=function(p,t){

      closeModal();

    query=s.query||'';filter=s.filter||'';
    libraryCategory=s.libraryCategory||'全部';libraryLayout=s.libraryLayout||'grid';

  });

(function(){

function validCoord(lat,lng){return lat!==''&&lng!==''&&lat!=null&&lng!=null&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))&&Math.abs(Number(lat))<=90&&Math.abs(Number(lng))<=180}

function drawAlerts(){const globalRoot=$('gpsGlobalAlerts');const root=document.getElementById('gpsAlerts')||globalRoot;if(root!==globalRoot)globalRoot.innerHTML='';const currentGroups=groups();root.innerHTML=[...alerts.keys()].map(id=>{const g=currentGroups.find(g=>g.store.id===id);if(!g){alerts.delete(id);return ''}return `<article class="gps-alert"><strong>已靠近 ${esc(g.store.name)}</strong><ul>${g.items.map(x=>`<li>${esc(x.name)} × ${Math.max(1,Number(x.qty)||1)}</li>`).join('')}</ul><button class="btn" data-gps-dismiss="${esc(id)}">知道了</button></article>`}).join('');root.querySelectorAll('[data-gps-dismiss]').forEach(b=>b.onclick=()=>{alerts.delete(b.dataset.gpsDismiss);drawAlerts()})}
function processPosition(pos){if(!running||document.hidden)return;const {latitude:lat,longitude:lng,accuracy}=pos.coords||{};

function settings(){focusBefore=document.activeElement;const root=$('gpsDialog');root.hidden=false;root.innerHTML=`<section><div class="row"><h2 id="gpsTitle">提醒設定與店家</h2><button class="btn" onclick="ShoppingGPS.close()">關閉</button></div><label>提醒距離<select id="gpsRadius">${[100,200,500,1000].map(n=>`<option value="${n}" ${n===radius()?'selected':''}>${n} 公尺</option>`).join('')}</select></label><button class="btn" id="gpsNotification">允許系統通知（選用）</button><p id="gpsSettingsStatus" role="status"></p><p class="muted">頁內提醒不需通知權限。系統通知是否顯示取決於瀏覽器；本版不支援背景定位。</p><h3>新增／編輯確切分店位置</h3><p>同名分店請分別建立。可在地圖長按店家位置取得經緯度，或人在店內時使用目前位置。</p><form id="gpsStoreForm"><input name="id" type="hidden"><label>分店名稱<input name="name" required maxlength="120" placeholder="例如：御菓子御殿 國際通店"></label><div class="two"><label>緯度（-90～90）<input name="lat" type="number" step="any" min="-90" max="90" required></label><label>經度（-180～180）<input name="lng" type="number" step="any" min="-180" max="180" required></label></div><div class="gps-actions"><button class="btn" type="button" id="gpsUseCurrent">使用目前位置</button><button class="btn primary" type="submit">儲存店家</button></div><p id="gpsFormStatus" role="status"></p></form><h3>已設定店家</h3><div>${locations().map(s=>`<div class="gps-store"><strong>${esc(s.name)}</strong><p>${esc(s.lat)}, ${esc(s.lng)}</p><button class="btn" data-gps-edit="${esc(s.id)}">編輯位置</button> <button class="btn danger" data-gps-delete="${esc(s.id)}">刪除</button></div>`).join('')||'<p>尚未設定店家</p>'}</div></section>`;

      '<hr><h3>選好分店後，建立 GPS 提醒</h3>'+
      '<p class="muted">從地圖複製確切分店的經緯度。僅輸入店名無法準確提醒；同一分店可連結多個商品。</p>'+
      '<label class="field">分店名稱<input name="storeName" maxlength="120" placeholder="例如：御菓子御殿 國際通店"></label>'+
      '<div class="two"><label class="field">緯度<input name="storeLat" type="number" step="any" min="-90" max="90" placeholder="26.214"></label><label class="field">經度<input name="storeLng" type="number" step="any" min="-180" max="180" placeholder="127.68"></label></div>'+
      '<label class="field">或選擇已儲存分店<select name="existingStore"><option value="">新增分店／不選擇</option></select></label>'+
      '<div class="actions"><button class="btn primary" type="button" data-link-store>儲存並連結 GPS 提醒</button></div>'+
      '<p role="status" data-store-status></p>';
    dialog.appendChild(panel);document.body.appendChild(dialog);
    panel.querySelector('[name=product]').value=item.name||'';
    panel.querySelector('[name=destination]').value=[trip.city||item.city,trip.country||item.country].filter(Boolean).join(' ')||'';
    const stores=Array.isArray(data.shoppingPlaces)?data.shoppingPlaces:[];
    const existing=panel.querySelector('[name=existingStore]');
    for(const store of stores){if(!store||!store.id)continue;const option=document.createElement('option');option.value=store.id;option.textContent=store.name||'未命名分店';existing.appendChild(option)}
    panel.querySelector('[data-link-store]').onclick=()=>{
      const status=panel.querySelector('[data-store-status]');
      if(dataLoadFailed){status.textContent='原始資料無法讀取，暫時不能修改。';return}
      const existingId=existing.value;
      let store=stores.find(x=>x.id===existingId);
      let added=false;
      const previousStores=data.shoppingPlaces;
      const previousId=item.shoppingPlaceId;
      if(!store){
        const name=panel.querySelector('[name=storeName]').value.trim();
        const latText=panel.querySelector('[name=storeLat]').value.trim();
        const lngText=panel.querySelector('[name=storeLng]').value.trim();
        const lat=Number(latText),lng=Number(lngText);
        if(!name||!latText||!lngText||!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180){status.textContent='請輸入分店名稱及有效的緯度、經度，或選擇已儲存分店。';return}
        store=stores.find(x=>x.name===name&&Number(x.lat)===lat&&Number(x.lng)===lng);
        if(!store){store={id:uid(),name,lat,lng};data.shoppingPlaces=[...stores,store];added=true}
      }
      item.shoppingPlaceId=store.id;
      if(!save()){item.shoppingPlaceId=previousId;data.shoppingPlaces=previousStores;status.textContent='儲存失敗，資料未更動。';return}
      status.textContent='已連結 '+store.name+'。啟用 GPS 提醒後，靠近分店會提醒未購商品。';
      if(added){const option=document.createElement('option');option.value=store.id;option.textContent=store.name;existing.appendChild(option)}
      existing.value=store.id;
      render();
    };
    panel.querySelector('[data-close]').onclick=close;
    dialog.addEventListener('click',e=>{if(e.target===dialog)close()});
    panel.querySelector('[data-search]').onclick=()=>{
      const name=panel.querySelector('[name=product]').value.trim(),place=panel.querySelector('[name=destination]').value.trim();
      if(!name){panel.querySelector('[name=product]').focus();return;}
      const query=[name,place,'哪裡買'].filter(Boolean).join(' ');
      window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query),'_blank','noopener,noreferrer');
    };
    panel.querySelector('[name=product]').focus();
  }
  function install(){
    if(typeof window.render!=='function'||typeof data==='undefined')return;
    const original=window.render;
    window.render=function(){
      original.apply(this,arguments);
      if(page!=='shopping')return;
      const app=document.getElementById('app');if(!app||app.querySelector('[data-tripin-find]'))return;
      const wrap=document.createElement('div');wrap.className='panel';wrap.style.marginBottom='16px';
      const h=document.createElement('h3');h.textContent='旅點智慧尋物 · 幫我找店家';wrap.appendChild(h);
      const p=document.createElement('p');p.className='muted';p.textContent='選擇清單中的商品後，才會開啟搜尋。可搜尋全球店家，實際販售與庫存請以官方資訊為準。';wrap.appendChild(p);
      const select=document.createElement('select');select.setAttribute('aria-label','選擇待購商品');select.style.maxWidth='100%';
      const items=data.items.filter(x=>x.type==='商品'&&!x.bought);
      const empty=document.createElement('option');empty.value='';empty.textContent='請選擇商品';select.appendChild(empty);
      for(const x of items){const o=document.createElement('option');o.value=x.id;o.textContent=x.name||'未命名商品';select.appendChild(o)}
      wrap.appendChild(select);
      const btn=document.createElement('button');btn.className='btn primary';btn.style.marginLeft='8px';btn.dataset.tripinFind='';btn.textContent='幫我找店家';btn.onclick=()=>{if(select.value)open(select.value);else select.focus()};wrap.appendChild(btn);
      app.prepend(wrap);
    };
    window.render();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script>
</body></html>
