<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://xxzchaewtmctplhamwwi.supabase.co; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>旅點 TRIPIN｜雲端登入預覽（Beta）</title>
<style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#263c3b;background:#f7f7f1}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:720px;margin:35px auto}header{margin-bottom:22px}h1{margin:0 0 6px;color:#477c70}p{line-height:1.7}.card{background:white;border:1px solid #e4eae5;border-radius:18px;padding:22px;margin:15px 0}label{display:block;margin:14px 0 5px;font-size:14px}input{width:100%;padding:12px;border:1px solid #cad8d1;border-radius:10px;font:inherit}button{font:inherit;background:#477c70;color:white;border:0;border-radius:10px;padding:11px 17px;cursor:pointer;margin-top:14px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8efe9;color:#263c3b;margin-left:8px}.muted{color:#657873;font-size:14px}.warning{background:#fbf3e4;padding:12px;border-radius:10px}li{padding:9px 0;border-bottom:1px solid #eef1ed}#status{min-height:26px}a{color:#477c70} [hidden]{display:none!important}</style></head>
<body><main><header><a href="./">← 回 TRIPIN Beta</a><h1>✦ 旅點 TRIPIN</h1><p>雲端帳號預覽 · 僅限非正式測試資料庫</p></header>
<div class="warning">這是獨立的測試頁面。只讀取登入者的雲端旅行與購物商品，不會修改、匯入或覆蓋原本網站的本機資料。請使用 Supabase 測試帳號及其專用密碼，不要使用信箱本身的密碼。</div>
<section class="card" id="loginPanel"><h2>測試帳號登入</h2><form id="loginForm" autocomplete="off"><label for="key">Supabase Publishable key（公開金鑰，不是 service_role）</label><input id="key" required spellcheck="false" autocomplete="off"><label for="email">測試帳號 Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Supabase 測試密碼</label><input id="password" type="password" required autocomplete="current-password"><button id="loginButton" type="submit">登入並查看雲端資料</button></form></section>
<section class="card" id="dataPanel" hidden><h2>我的雲端旅行</h2><p class="muted" id="who"></p><button type="button" id="refreshButton">重新整理</button><button type="button" id="logoutButton" class="secondary">登出</button><ul id="trips"></ul><div id="items"></div></section>
<p id="status" role="status" aria-live="polite"></p><p class="muted">登入資訊只保留在此頁面的記憶體中，重新整理或關閉頁面後需重新登入。公開測試頁面請勿使用正式帳號。</p>
</main><script>
'use strict';
(()=>{const base='https://xxzchaewtmctplhamwwi.supabase.co';let session=null;const $=id=>document.getElementById(id);const uuid=/^[0-9a-f-]{36}$/i;
const status=s=>$('status').textContent=s;
async function api(path,opts={}){if(!session)throw Error('請先登入');const res=await fetch(base+path,{...opts,headers:{apikey:session.key,Authorization:'Bearer '+session.token}});if(!res.ok)throw Error('雲端請求失敗（HTTP '+res.status+'）');return res.json()}
function line(parent,text){const li=document.createElement('li');li.textContent=text;parent.appendChild(li)}
async function load(){if(!session)return;status('正在讀取自己的旅行…');const user=await api('/auth/v1/user');if(!uuid.test(user.id))throw Error('無效的帳號身分');$('who').textContent='目前登入：'+(user.email||'測試使用者');const trips=await api('/rest/v1/trips?owner_id=eq.'+encodeURIComponent(user.id)+'&select=id,name,destination,start_date,end_date&order=created_at.desc');if(!session)return;$('trips').replaceChildren();$('items').replaceChildren();if(!trips.length)line($('trips'),'此帳號尚無雲端旅行資料（本機示範旅行不會自動出現在這裡）');for(const trip of trips){line($('trips'),trip.name+(trip.destination?' · '+trip.destination:''));const heading=document.createElement('h3');heading.textContent=trip.name+' 的購物清單';$('items').appendChild(heading);const list=document.createElement('ul');$('items').appendChild(list);const items=await api('/rest/v1/shopping_items?trip_id=eq.'+encodeURIComponent(trip.id)+'&select=name,quantity,bought&order=created_at.asc');if(!session)return;if(!items.length)line(list,'尚無商品');else for(const item of items)line(list,(item.bought?'✓ 已購買 · ':'○ 待購買 · ')+item.name+' × '+item.quantity)}status('讀取完成。這些資料僅供預覽，未修改任何資料。')}
function logout(){session=null;$('password').value='';$('loginPanel').hidden=false;$('dataPanel').hidden=true;$('trips').replaceChildren();$('items').replaceChildren();status('已登出；此頁面的登入資訊已清除。')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('loginButton');button.disabled=true;const key=$('key').value.trim(),email=$('email').value.trim(),password=$('password').value;try{if(!key||!email||!password)throw Error('請填寫所有欄位');status('登入中…');const res=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!res.ok)throw Error('登入失敗，請檢查測試帳號與密碼（HTTP '+res.status+'）');const result=await res.json();if(!result.access_token)throw Error('未取得有效的登入憑證');session={key,token:result.access_token};$('password').value='';$('loginPanel').hidden=true;$('dataPanel').hidden=false;await load()}catch(err){status(err.message||'登入或讀取失敗');if(!$('dataPanel').hidden){session=null;$('loginPanel').hidden=false;$('dataPanel').hidden=true;$('password').value=''}}finally{button.disabled=false}});
$('refreshButton').onclick=()=>load().catch(e=>status(e.message));
$('logoutButton').onclick=logout;
})();
</script></body></html>
